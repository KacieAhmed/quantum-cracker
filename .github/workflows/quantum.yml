name: quantum-grover

on:
  push:
    branches: [main]
    paths: ["quantum/**", ".github/workflows/quantum.yml"]
  pull_request:
    paths: ["quantum/**", ".github/workflows/quantum.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantum/grover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quantum/grover/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (smoke + sweep + charts)
        run: pytest tests
