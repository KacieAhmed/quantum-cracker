[workspace]
resolver = "2"
members = [
    "crates/cracker-core",
    "crates/cracker-cli",
    "crates/cracker-factory",
    "crates/cracker-wasm",
]

[workspace.dependencies]
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
ripemd = "0.1"
k256 = { version = "0.13", default-features = false, features = [
    "arithmetic",
    "precomputed-tables",
    "std",
] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
bs58 = { version = "0.5", default-features = false, features = ["check", "alloc"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ethnum = "1.5"
signal-hook = "0.3"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
